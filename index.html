<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小手机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#EFECE7;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* 顶部栏 */
.header{
  background:rgba(239,236,231,0.7);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.4);
  border-radius:28px;
  margin:12px;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header h2{font-size:17px;color:#222;font-weight:500}
.set-btn{border:none;background:#fff;padding:6px 12px;border-radius:16px;font-size:14px}

/* 聊天区域 */
#chatBox{
  flex:1;
  overflow-y:auto;
  padding:0 14px 10px;
}
.msg{margin:10px 0;display:flex}
.user-msg{justify-content:flex-end}
.ai-msg{justify-content:flex-start}
/* 气泡样式 */
.bubble{
  max-width:75%;
  padding:12px 16px;
  border-radius:22px;
  position:relative;
  border:1px solid rgba(0,0,0,0.08);
}
.user-msg .bubble{
  background:#b8b8b8;
  color:#111;
  border-bottom-right-radius:4px;
}
.ai-msg .bubble{
  background:#684b4b;
  color:#fff;
  border-bottom-left-radius:4px;
}
/* 角落图标 */
.user-msg .bubble::after{
  content:"🐱";
  position:absolute;
  right:6px;
  bottom:4px;
  font-size:16px;
}
.ai-msg .bubble::after{
  content:"🐦‍⬛";
  position:absolute;
  left:6px;
  bottom:4px;
  font-size:16px;
}

/* 底部输入栏 */
.input-area{
  background:rgba(239,236,231,0.85);
  backdrop-filter:blur(24px);
  padding:12px;
  display:flex;
  gap:8px;
}
#messageInput{
  flex:1;
  border-radius:24px;
  border:1px solid #ddd;
  padding:12px 16px;
  outline:none;
  background:#fff;
  font-size:15px;
}
#sendBtn{
  border:none;
  background:#333;
  color:white;
  border-radius:24px;
  padding:0 18px;
}

/* 设置弹窗 */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-content{
  background:#EFECE7;
  width:100%;
  max-width:420px;
  border-radius:24px;
  padding:20px;
}
.modal-content h3{margin-bottom:14px}
.modal-content input,textarea{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid #ccc;
}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row button{flex:1;padding:10px;border:none;border-radius:14px}
.save{background:#444;color:white}
.close{background:#bbb}
</style>
</head>
<body>
<div class="header">
  <h2>小手机</h2>
  <button class="set-btn" onclick="openSetting()">设置</button>
</div>

<div id="chatBox"></div>

<div class="input-area">
  <input id="messageInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()">
  <button id="sendBtn" onclick="sendMsg()">发送</button>
</div>

<!-- 设置弹窗 -->
<div class="modal" id="settingModal">
<div class="modal-content">
  <h3>API配置</h3>
  <input id="apiUrl" placeholder="API地址 例：https://xxx/v1">
  <input id="apiKey" placeholder="API Key">
  <input id="modelName" placeholder="模型名称">
  <textarea id="systemPrompt" rows="3" placeholder="角色人设/健康陪伴提示词"></textarea>
  <div class="btn-row">
    <button class="save" onclick="saveConfig()">保存</button>
    <button class="close" onclick="closeSetting()">关闭</button>
  </div>
</div>
</div>

<script>
// 读取本地保存配置
let config = JSON.parse(localStorage.getItem("chatConfig")) || {};
document.getElementById("apiUrl").value = config.apiUrl || "";
document.getElementById("apiKey").value = config.apiKey || "";
document.getElementById("modelName").value = config.modelName || "";
document.getElementById("systemPrompt").value = config.systemPrompt || "";

const chatBox = document.getElementById("chatBox");
const input = document.getElementById("messageInput");

function openSetting(){document.getElementById("settingModal").style.display="flex"}
function closeSetting(){document.getElementById("settingModal").style.display="none"}

function saveConfig(){
  config.apiUrl = document.getElementById("apiUrl").value.trim();
  config.apiKey = document.getElementById("apiKey").value.trim();
  config.modelName = document.getElementById("modelName").value.trim();
  config.systemPrompt = document.getElementById("systemPrompt").value.trim();
  localStorage.setItem("chatConfig", JSON.stringify(config));
  alert("配置已保存！");
  closeSetting();
}

// 添加消息到页面
function addMsg(text, isUser){
  const div = document.createElement("div");
  div.className = isUser ? "msg user-msg" : "msg ai-msg";
  div.innerHTML = `<div class="bubble">${text}</div>`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// 发送消息
async function sendMsg(){
  const text = input.value.trim();
  if(!text) return;
  if(!config.apiUrl || !config.apiKey){
    alert("先点右上角设置，填写API信息！");
    openSetting();
    return;
  }
  addMsg(text, true);
  input.value = "";

  const messages = [];
  if(config.systemPrompt) messages.push({role:"system", content:config.systemPrompt});
  
  // 收集历史对话
  document.querySelectorAll(".msg").forEach(item=>{
    const txt = item.querySelector(".bubble").innerText;
    const role = item.classList.contains("user-msg") ? "user" : "assistant";
    messages.push({role, content:txt});
  })

  try{
    const res = await fetch(`${config.apiUrl}/chat/completions`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${config.apiKey}`
      },
      body:JSON.stringify({
        model: config.modelName,
        messages: messages,
        temperature:0.7
      })
    })
    const data = await res.json();
    const reply = data.choices[0].message.content;
    addMsg(reply, false);
  }catch(err){
    addMsg("连接失败！检查API地址、密钥，或者该中转不支持浏览器访问", false);
  }
}
</script>
</body>
</html>
